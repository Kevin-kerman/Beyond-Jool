@EXPERIMENT_DEFINITION:HAS[#id[surfaceSample]]{    @RESULTS    {       SarkinSrfLanded = You don't even know how you did this. All that's in the bottle is gas.       SappSrfLandedLowlands = You dig a bit and find... ? How did that get here?       SappSrfLandedMidlands = It's very icy here. Still. Whoopie.       SappSrfLandedHighLands = It seems there is ice here. Some under the engine is slightly wet.       MoachSrfLandedRustyRedShores = It's... wiggly? It's trying to escape? Something is not right. That is NOT rust.
       MoachSrfLandedFrozenSeas = The sample is very icy. You try to sneak a taste, but spit it out - the ice is very saline.
       MoachSrfLandedRegionofMt.Ebott = Very icy. There's a very fine lump of dust in this though, probably from the mountain.
       MoachSrfLandedMt.Ebott = You carefully carve the sample from the cliff. Lo and behold, it's just very dusty rock.
       MoachSrfLanded = This is very dirty rock. To think life may once have grown here...    }}@EXPERIMENT_DEFINITION:HAS[#id[crewReport]]{    @RESULTS    {	SarkinSrfLanded = Huh? Like, how???? The craft says you landed... ON A GAS GIANT?!?!?!??!	SarkinFlyingLowNorthernPolarStorm = As you fly deep into Sarkin's atmosphere, you pray and hope Mission Control knows what they're doing. It's all you can do. You think you can feel the giant storm below you. This is how you die, isn't it?	SarkinFlyingLowSouthPole = As you fly deep into Sarkin's atmosphere, you pray and hope Mission Control knows what they're doing. It's all you can do.	SarkinFlyingLowNorthernClouds = As you fly deep into Sarkin's atmosphere, you pray and hope Mission Control knows what they're doing. You can hear thunder and see lightning. It's all you can do.	SarkinFlyingLowSouthernClouds = As you fly deep into Sarkin's atmosphere, you pray and hope Mission Control knows what they're doing. It's all you can do.	SarkinFlyingLowEquatorialBand = As you fly deep into Sarkin's atmosphere, you pray and hope Mission Control knows what they're doing. You feel the entire craft shaking under all the pressure. It's all you can do.	SarkinFlyingHigh = As the giant planet takes up the view, you begin to wonder what Mission Control was thinking. Why should you be flying into a gas giant? Probably the same reason they do most things; "It's cool."	SarkinInSpaceLow = You look out and see Sarkin, and the gigantic blue world slightly reminds you of Kerbin. From here, you can make out the individual storms and clouds, yet Kerin is only a pale blue dot.        SarkinInSpaceHigh = You look out the window. You can easily see Sarkin and Tyrant. If you squint you can also see Sapp and Moach. But the sun is a speck from here. You can't wait for the journey to come.        AronInSpaceHigh = Out the window you can see the majestic Sarkin and its many moons, with Aron and its many cracks and canyons.        AronInSpaceLow = As you stare out into space, you notice just how many cracks and canyons Aron has from gravitational forces from Sarkin attempting to rip the moon apart.    }}@EXPERIMENT_DEFINITION:HAS[#id[evaReport]]{    @RESULTS    {	SarkinInSpaceHigh = You look back to Kerbin. It's been a long time, hasn't it?	SarkinInSpaceLow = From here, you can look and see the rings, and Sarkin's many moons. The gigantic planet's storms are visible also.	SarkinFlyingLowNorthPole = OH NO OH NO OH GOD HELP PLEASE I DON'T WANNA DIE WHY DO YOU MAKE ME SUFFER	SarkinFlyingHigh = What dummy thought this was a good idea?	SarkinFlyingLowNorthernClouds = Well, we had a good run.	SarkinFlyingLowSouthernClouds =  We're going to die, aren't we?	SarkinFlyingLowSouthPole = You really are going to need a miracle. Despite likely falling to our death, it's quite calm here.	SarkinFlyingLowEquatorialBand = The wind pushes at you like a ragdoll. The pressures slowly crack your visor. How much more can your suit take?	SappSrfLandedLowlands = It's nice to feel a significant amount of gravity again. You feel weak, however.	TyrantSrfLandedLowlands = Did you gain weight or.. OW! You could swear you felt something crack. Under the enormous gravity you feel like you are carrying 2 more you's.	MoachSrfLandedRegionofMt.Ebott = Some how, despite it simply being a mountain, looking at it fills you with... DETERMINATION.
	MoachSrfLandedMt.Ebott = Suprisingly serene up here. Your mind wanders, to singing birds and blooming flowers.
       MoachFlyingLow = You think about taking your helmet off. Then again, this might be in the death zone.
       MoachSrfLanded = Your memory of the mission brief serves you right - this is definitely a 'dead world'.
       MoachSrfLandedRustyRedShores = Did something just move? Must've been the wind.
       MoachFlyingLowRegionofMt.Ebott = Hurtling past the big pin, it fills you with... DETERMINATION.
       MoachFlyingLowMt.Ebott = That's quite close. Hope you've done STOL training lately.
       MoachFlyingHigh = This seems like a bad idea. Oh well, at least I can
       MoachInSpaceLow = Looking down at the big snowball fills you with... quite a sense of dread. Either that or you need more snacks pronto.
       MoachInSpaceHigh = From up here, Moach doesn't seem to dissimilar to Kerbin. Minus Sarkin in the background. And the frozen wastes. And everything else.    }  }@EXPERIMENT_DEFINITION:HAS[#id[mysteryGoo]]{    @RESULTS    {	SarkinSrfLanded = The Mystery Goo.. is quite confused.	SarkinFlyingLow = The Goo questions your decisions.	SarkinFlyingHigh = The Goo looks almost scared by the outside atmosphere. It clumps up in a little ball.	SarkinInSpaceLow = The Goo is quite pleased, and curious about what lies ahead.	SarkinInSpaceHigh = The Goo is curious about what lies ahead.    }}@EXPERIMENT_DEFINITION:HAS[#id[mobileMaterialsLab]]{    @RESULTS    {        SarkinSrfLanded = The SC-9001 just gives one message, "Look, what weird stuff did you do this time to LAND ON A GAS GIANT???" Truth is, we don't know.	SarkinFlyingLow = The SC-9001 begins to break under the high pressures. Science!	SarkinFlyingHigh = The SC-9001 said it doesn't want to die, but how can something die that was never alive?		SarkinInSpaceLow = The SC-9001 appears to have broken from high speed-small particles, as the machine is sputtering out nonsense.		SarkinInSpaceHigh = The SC-9001 appears quite... calm?		AronInSpaceLow = The SC-9001 refuses to open the doors. Like at Jool, it said "I'm sorry Dave, but I can't let you do that." But who on Kerbin is Dave??? Again, the SC-9001 began to work once the fusebox was opened. Maybe the Science Jr. doesn't like gas giants?		AronInSpaceHigh = Uh.. What was that noise? And the bay doors are shut. Great.
		MoachSrfLandedRustyRedShores = The SC-9001 keeps saying "WARNING, WARNING". Odd.		    }}@EXPERIMENT_DEFINITION:HAS[#id[barometerScan]]{    @RESULTS    {            SarkinFlyingLow = Please exit this region. Going lower may cause complete vessel destruction. Atmospheric pressure here is greater than 1 ATM.	     SarkinFlyingHigh = It appears you have entered the upper atmosphere. Atmospheric pressure is less than 1 ATM.	     SarkinInSpaceLow = You must think you're really smart for using the ATMOSPHERIC SCANNER in SPACE. Seems mommy never told you got F minus in basic science. 	Here's some science as pity.	     SarkinInSpaceHigh = You must think you're really smart for using the ATMOSPHERIC SCANNER in SPACE. Seems mommy never told you got F minus in basic science. 	Here's some science as pity.    }}@EXPERIMENT_DEFINITION:HAS[#id[seismicScan]]{    @RESULTS    {        SarkinSrfLanded = Hmm yes the air is solid here because (REASON NOT FOUND).        SappSrfLanded = The planet seems to be geologically active, likely while not having a substantial atmosphere, is the reason for there being a lack of craters.
        MoachSrfLanded = Not many readings. Makes sense, this is a very dead world.
       MoachSrfLandedRustyRedShores = Not much, but there is very erratic background noise.
       MoachSrfLandedMt.Ebott = Higher than the rest of the surface. This might be a cryovolcano. Wait, no, you hit the seismometer by accident.    }}@EXPERIMENT_DEFINITION:HAS[#id[atmosphereAnalysis]]{    @RESULTS    {        SarkinFlyingHigh = ... Loading ... Loading ... Analysis complete. 90.75% Hydrogen, 9.25% Helium.	SarkinFlyingLow = ... Loading ... Loading ... Analysis complete. 90.75% Hydrogen, 9.25% Helium.   Trace amounts of Methane and Ammonia detected.	TyrantFlyingLow = ... Loading ... Loading ... Analysis complete. 90.75% Hydrogen, 9.25% Helium. Trace amounts of Oxygen detected- too low to support jet engine flight.				TyrantFlyingHigh = ... Loading ... Loading ... Analysis complete. 90.75% Hydrogen, 9.25% Helium.	VolatusFlyingLow = ... Loading ... Loading ... Analysis complete. 50% Carbon Monoxide, 50% Nitrogen. Traces of Oxygen detected.	VolatusFlyingHigh = ... Loading ... Loading ... Analysis complete. 50% Carbon Monoxide, 50% Nitrogen.    }}@EXPERIMENT_DEFINITION:HAS[#id[magnetometer]]{    @RESULTS    {	SarkinInSpaceLow = Sarkin's core is not like that of Jool's. It is not calm. The magnetometer shows that the planet is still very alive.        SarkinInSpaceHigh = The magnetometer shows an incredibly strong magnetosphere. It appears to extend nearly to Tyrant's orbit.	TyrantInSpaceHigh = The moon here (can you really call it that?) has ITS OWN MAGNETOSPHERE!!?!?!??! Cool.	TyrantInSpaceLow = The moon here (can you really call it that?) has ITS OWN MAGNETOSPHERE!!?!?!??! Cool. Appears to be stronger than Kerbin's.     }}