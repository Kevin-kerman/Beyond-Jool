@Kopernicus:AFTER[MPE]:NEEDS[MPE]
{
	@Body[Crokslev]
	{
		@Properties
		{
			%description = Crokslev is the largest member of the "centaurs," a group of asteroids that wander around the orbits of the outer planets. Not much is known about Crokslev, as most would rather consider Jool or Sarkin for missions, both of which are not far from Crokslev. However, the recent discovery of rings around this object gave it several headlines and now the scientific community is starting to bat an eye towards the large, icy asteroid.	
		}
		@Orbit
		{
			%semiMajorAxis = 106693800000
		}
	}
}
@Kopernicus:AFTER[MPE]:NEEDS[MPE]
{
	@Body[Ervo]
	{
		@Properties
		{
			%description = Ervo is the most massive known object beyond the orbit of Sarkin. Its discovery and size, comparable to Plad's, ultimately led to the demotion of Plad to a dwarf planet. Numerous fight-related injuries are now directly tied to Ervo's existence. Ervo has a tenuous atmosphere with a heavy concentration of oxygen. There is considerable debate over the origin of this oxygen, whether Ervo has life or is simply oversaturated is a question that could only be answered with a visit. The conditions are also suitable for liquid oxygen to exist on the surface, but what are the chances of that?
		}
		@Orbit
		{
			%semiMajorAxis = 375338000000
			%eccentricity = 0.25
		}
	}
}
@Kopernicus:AFTER[MPE]:NEEDS[MPE]
{
	@Body[Havous]
	{
		@Properties
		{
			%description = Havous was originally referred to as Plad's sister. This, however, is no longer the case. Every new discovery relating to Havous seemed to further make the point clear that Havous was a very unusual world indeed. From its squished shape, tight rings, and blue patch, Havous has more recently been called the "outer-system jewel."
		}
		@Orbit
		{
			%semiMajorAxis = 357500000000
		}
	}
}
@Kopernicus:AFTER[MPE]:NEEDS[MPE]
{
	@Body[Mracksis]
	{
		@Properties
		{
			%description = Mracksis is a very red dwarf planet living around the same region of space as Havous. The vibrant red coloration is the result of tholins building up on the surface. The reason why Mracksis possesses such a high global concentration of tholins, while objects like Plad or Havous do not, is a mystery. Unfortunately Mracksis does not get the same amount of attention as other objects beyond Plad, missions to this region take years to travel, perhaps now is the time to finally send a visitor?
		}
		@Orbit
		{
			%semiMajorAxis = 379620000000
		}
	}
}
@Kopernicus:AFTER[MPE]:NEEDS[MPE]
{
	@Body[Soden]
	{
		@Orbit
		{
			%semiMajorAxis = 1500000000000
			%longitudeOfAscendingNode = 114
			%eccentricity = 0.9
		}
	}
}