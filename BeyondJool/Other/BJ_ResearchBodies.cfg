RESEARCHBODIES
{
	loadAs = mod
	name = BeyondJool
	ONDISCOVERY
	{
		Sarkin = It appears that, far, far beyond Jool lies a gigantic world, also roughly 8x the mass. This world is not completely understood like the other planets, which have been known to at the very least exist since prehistoric times.
		Aron = A bright moon of Sarkin, Aron has a large crater, and likely cracked by the enormous mass and gravity of Sarkin, named after our investor, Aron Kerman. It has been described by some as a giant iceball.
		Moach = Once we saw this world we knew it was something special. With a blue atmosphere and high albedo, it likely has oxygen and ice. Something lies here. What that is, we do not know.
		Kotta = This rocky world has something that makes it special: it is oblate. This makes it much easier to land on here.
		Tyrant = Tyrant is really a tyrant. Twice the size of Kerbin, quadruple the gravity. It even hosts a moon, we think. It'd be great for gravity assists.
		Volatus = This world is a world of flight. With 3 ATM and less than Moho gravity, it's probably very easy to, well, fly here. It even has oceans!
		Hope = Hope is just a teeny tiny rock. It would be a good idea to mine here.
		Sapp = Sapp. This orbital diamond also has a beautiful set of rings. It appears to be a captured dwarf planet. 
		Plad = Eeloo is not alone. A new dwarf planet has been found, beyond even Sarkin. It will need unconventional antennas to communicate to here.
		Chau = It has a moon! Nearly the polar opposite, light blue and grey, half the size. It is may actually be a binary system of Plad and Chau.
		Hamis = Hamis appears to be oblate, much more than Kotta. And a icy blue, appears to also be ringed, with a gigantic ring system.
		Haki = Hamis has a very small moon. We're surprised we found it, considering it is much smaller, then, say, Gilly. It is likely made of the ices of the ring.
		Elross = There is another. This planet shepards the Robau Belt, capturing the dwarfs it finds along the way.
		Mrokrok = Mrokrok is a poor moon forever stuck to the confines of Elross. It makes a pretty picture, though!
		Bongbong = Bongbong is another captured moon, and with very pretty contrasts of reds and blues.
		Dakota = Dakota is a red world. We don't understand much else, with the incredible distance from Kerbin. Its orbit suggests another planet far beyond this one. But, we're tired. You go find it. We're done. It is likely impossible to find, anyway.
	}
	IGNORELEVELS
	{
		// body = easy normal medium hard
		Sarkin = false false false false
		Aron = false false false false
		Moach = false false false false
		Kotta = false false false false
		Tyrant = false false false false
		Volatus = false false false false
		Hope = false false false false
		Sapp = false false false false
		Plad = false false false false
		Chau = false false false false
		Hamis = false false false false
		Haki = false false false false
		Elross = false false false false
		Mrokrok = false false false false
		Bongbong = false false false false
		Dakota = false false false false
	}
}

@PART[TrackBodiesTelescope]:NEEDS[BeyondJool]
{
	@MODULE[ModuleTrackBodies]
	{
		showUpgradesInModuleInfo = true
		UPGRADES
		{
			UPGRADE
			{
				name__ = RB_Upgrade_BJ
				difficulty = 6
				scienceReward = 25
				minAltitude = 400000
				maxTrackDistance = 6E+11
				electricChargeRequest = 15
				description__ = Upgrade for ResearchBodies Telescope.
				
			}
		}
	}
}

PARTUPGRADE:NEEDS[BeyondJool]
{
	name = RB_Upgrade_BJ
	partIcon = TrackBodiesTelescope
	techRequired = largeUnmanned
	title = Discovery Telescope Upgrade
	basicInfo = Upgrade ResearchBodies Telescope
	description = Increases the telescope's range to 800 Gm, roughly 20x its original range, to potentially help discovery far beyond Jool.  The minimum required operating altitude is also raised to 500 km for reduced chance of glare from the body the telescope is orbiting.
	entryCost = 15000
}